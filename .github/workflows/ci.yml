name: Flow native CNN reference
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-flow-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4
      - name: Prepare C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc clang make
      - name: Checkout pinned Flow compiler
        run: |
          git clone --depth=1 https://github.com/flooooooooooow/flow.git ../flow
          cd ../flow
          git fetch --depth=1 origin 69c8ec453941a1738ac06343bdcb440025610c67
          git checkout 69c8ec453941a1738ac06343bdcb440025610c67
      - name: Compile and exercise all native Flow numerical primitives
        run: ../flow/flow run smoke.flow
      - name: Compile complete training entrypoint
        run: ../flow/flow compile train.flow
      - name: Benchmark reference versus contiguous convolution
        run: ../flow/flow run bench.flow
      - name: Generate small synthetic CIFAR binary fixtures
        run: python3 scripts/generate-fixture.py
      - name: Exercise end-to-end training and evaluation without PyTorch
        env:
          HLB_TRAIN_LIMIT: "16"
          HLB_EVAL_LIMIT: "8"
          HLB_WIDTH: "2"
          HLB_BATCH: "2"
          HLB_EPOCHS: "1"
          HLB_WHITEN_EXAMPLES: "16"
        run: |
          ../flow/flow run train.flow
          test -s hlb-current.bin
          test -s hlb-ema.bin

      - name: Exercise validation holdout without test-set leakage
        env:
          HLB_TRAIN_LIMIT: "16"
          HLB_VAL_HOLDOUT: "4"
          HLB_WIDTH: "2"
          HLB_BATCH: "2"
          HLB_EPOCHS: "1"
          HLB_WHITEN_EXAMPLES: "12"
        run: ../flow/flow run train.flow

      - name: Reload model and run standalone Flow inference
        env:
          HLB_WIDTH: "2"
          HLB_BATCH: "2"
          HLB_EVAL_LIMIT: "8"
        run: ../flow/flow run infer.flow
